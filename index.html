<style>
  :root {
    --bg: #090a0d;
    --ink: #f3f4f6;
    --dim: #8b8f98;
    --line: #262a32;
    --cw: min(52vw, 37vh);            /* card width */
    --ch: calc(var(--cw) * 88 / 63);  /* card height */
    --ph: min(62vh, 108vw);           /* pack height */
    --pw: calc(var(--ph) * 0.56);     /* pack width */
    --lift: 4vh;                      /* cards sit a bit above centre, the label goes below */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 40%, #14161c 0%, var(--bg) 70%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage { position: fixed; inset: 0; perspective: 1500px; cursor: pointer; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  #hint {
    position: fixed; left: 0; right: 0; bottom: max(3.2vh, env(safe-area-inset-bottom));
    text-align: center; font-size: clamp(12px, 2.1vh, 15px); color: var(--dim);
    pointer-events: none; z-index: 40;
  }
  #hint b { color: var(--ink); font-weight: 600; }
  #title {
    position: fixed; left: 0; right: 0; top: max(3.4vh, env(safe-area-inset-top));
    text-align: center; pointer-events: none; z-index: 40;
    font-size: clamp(13px, 2.3vh, 17px); font-weight: 600; letter-spacing: -.01em;
    transition: opacity .3s;
  }
  #title small { display: block; margin-top: .4vh; font-size: .78em; font-weight: 400; color: var(--dim); letter-spacing: 0; }
  #stage:not([data-s="shelf"]) #title { opacity: 0; }

  /* ================= packs ================= */
  .pack {
    position: absolute; left: 50%; top: 50%;
    width: var(--pw); height: var(--ph);
    margin: calc(var(--ph) / -2) 0 0 calc(var(--pw) / -2);
    --o: 0; --a: 0; --rx: 0deg; --ry: 0deg; --sx: 50%; --sy: 30%;
    transform:
      translateX(calc(var(--o) * var(--pw) * 1.02))
      translateZ(calc(var(--a) * -260px))
      rotateY(calc(var(--o) * -24deg + var(--ry)))
      rotateX(var(--rx));
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.2, .8, .2, 1), opacity .35s, filter .35s;
    filter: drop-shadow(0 3vh 3.5vh rgba(0, 0, 0, .6)) brightness(calc(1 - var(--a) * .3));
    z-index: 20;
  }
  .pack.tilt { transition: transform .1s linear, opacity .35s, filter .35s; }
  .pack.far { opacity: 0; pointer-events: none; }
  #stage:not([data-s="shelf"]) .pack:not(.chosen) { opacity: 0; pointer-events: none; }
  .pack.off {
    transform: translateY(105vh) rotateZ(5deg);
    transition: transform .75s cubic-bezier(.6, 0, .9, .4), opacity .2s .6s;
    opacity: 0; pointer-events: none;
  }

  .strip, .pbody { position: absolute; left: 0; right: 0; overflow: hidden; }
  .wrap { /* the printed foil */
    background:
      linear-gradient(90deg, rgba(0,0,0,.34) 0%, rgba(255,255,255,.12) 7%, rgba(255,255,255,0) 20%, rgba(255,255,255,0) 80%, rgba(255,255,255,.1) 93%, rgba(0,0,0,.4) 100%),
      linear-gradient(165deg, var(--c1), var(--c2) 60%, var(--c3));
  }
  .crimp::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,.26) 0 1.2%, rgba(255,255,255,.22) 1.2% 2.4%);
  }
  .strip {
    top: 0; height: 8.5%; z-index: 3;
    -webkit-mask: conic-gradient(from 135deg at 50% 0, #000 90deg, #0000 0) 0 0 / 3.2% 5px repeat-x, linear-gradient(#000 0 0) 0 4.5px / 100% 100% no-repeat;
            mask: conic-gradient(from 135deg at 50% 0, #000 90deg, #0000 0) 0 0 / 3.2% 5px repeat-x, linear-gradient(#000 0 0) 0 4.5px / 100% 100% no-repeat;
    transform-origin: 100% 100%;
    transition: transform .55s cubic-bezier(.3, .7, .3, 1), opacity .3s .25s;
  }
  .pbody {
    top: 8.5%; bottom: 0;
    -webkit-mask: conic-gradient(from -45deg at 50% 100%, #000 90deg, #0000 0) 0 100% / 3.2% 5px repeat-x, linear-gradient(#000 0 0) 0 0 / 100% calc(100% - 4.5px) no-repeat;
            mask: conic-gradient(from -45deg at 50% 100%, #000 90deg, #0000 0) 0 100% / 3.2% 5px repeat-x, linear-gradient(#000 0 0) 0 0 / 100% calc(100% - 4.5px) no-repeat;
  }
  .art {
    position: absolute; left: 0; right: 0; top: 0; height: 74%;
    background-repeat: no-repeat;
    -webkit-mask: linear-gradient(180deg, #000 45%, #0000 100%);
            mask: linear-gradient(180deg, #000 45%, #0000 100%);
  }
  .shade { /* rounded-foil shading over the print: dark edges, soft vertical gloss bands */
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(90deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 9%, rgba(255,255,255,.16) 15%, rgba(255,255,255,0) 26%, rgba(255,255,255,0) 70%, rgba(255,255,255,.12) 86%, rgba(0,0,0,0) 91%, rgba(0,0,0,.55) 100%),
      linear-gradient(180deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 7%, rgba(0,0,0,0) 78%, rgba(0,0,0,.3) 100%);
  }
  .logo {
    position: absolute; left: 9%; width: 82%; bottom: 17%; height: 26%;
    object-fit: contain; object-position: 50% 100%;
    filter: drop-shadow(0 .5vh .8vh rgba(0, 0, 0, .55));
    pointer-events: none;
  }
  .count {
    position: absolute; left: 0; right: 0; bottom: 10.5%; text-align: center;
    font-size: calc(var(--pw) * .042); font-weight: 600; letter-spacing: .24em; text-transform: uppercase;
    color: rgba(255, 255, 255, .78); text-shadow: 0 1px 2px rgba(0, 0, 0, .5);
  }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 7.6%; background: rgba(0, 0, 0, .12); }
  .sheen { /* moving highlight on the wrapper */
    position: absolute; inset: 0; pointer-events: none; z-index: 4;
    background:
      radial-gradient(60% 45% at var(--sx) var(--sy), rgba(255,255,255,.5), rgba(255,255,255,0) 70%),
      linear-gradient(105deg, rgba(255,255,255,0) 32%, rgba(255,255,255,.22) 47%, rgba(255,255,255,0) 60%);
    mix-blend-mode: soft-light;
  }
  .mouth { /* dark opening left after the tear */
    position: absolute; left: 0; right: 0; top: 0; height: 5%; z-index: 2; opacity: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,0));
  }
  .cut { /* hot line that follows the tear */
    position: absolute; left: 0; top: 8.5%; height: 3px; margin-top: -1.5px; z-index: 5;
    width: calc(var(--cut, 0) * 100%);
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff 85%);
    box-shadow: 0 0 10px 2px rgba(255, 255, 255, .8);
    border-radius: 2px; opacity: 0;
  }
  .pack.cutting .cut { opacity: 1; }
  .pack.torn .cut { opacity: 0; transition: opacity .3s; }
  .pack.torn .strip { transform: translate(18%, -190%) rotate(38deg); opacity: 0; }
  .pack.torn .mouth { opacity: 1; }

  #glow { /* light spilling out of the opened pack */
    position: absolute; left: 50%; top: 50%; width: calc(var(--pw) * 2.2); height: calc(var(--pw) * 2.2);
    margin: calc(var(--ph) * -.42 - var(--pw) * 1.1) 0 0 calc(var(--pw) * -1.1);
    background: radial-gradient(closest-side, rgba(255, 244, 214, .55), rgba(255, 220, 150, .12) 45%, rgba(255,255,255,0) 70%);
    opacity: 0; transform: scale(.4); pointer-events: none; z-index: 10;
    transition: opacity .45s, transform .7s cubic-bezier(.2, .8, .2, 1);
  }
  #stage[data-s="out"] #glow { opacity: 1; transform: scale(1); }

  /* ================= cards ================= */
  #cards { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 15; opacity: 0; }
  #stage[data-s="out"] #cards, #stage[data-s="cards"] #cards { opacity: 1; }
  .card {
    position: absolute;
    width: var(--cw); height: var(--ch);
    left: calc(var(--cw) / -2); top: calc(var(--ch) / -2 - var(--lift));
    --d: 0; --mx: 0; --my: 0; --aura: transparent;
    transform: translate(calc(var(--d) * .45vh), calc(var(--d) * -.45vh)) scale(1);
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.3, .8, .3, 1), opacity .4s;
  }
  #stage[data-s="out"] .card { transform: translate(calc(var(--d) * .45vh), calc(var(--lift) + var(--d) * -.45vh)) scale(.86); transition: none; }
  .card.gone { transform: translate(-115vw, -4vh) rotate(-16deg); opacity: 0; transition: transform .5s cubic-bezier(.5, 0, .8, .4), opacity .3s .2s; }
  #aura { /* rarity glow behind the top card; kept outside the 3D card so it never cuts through it */
    position: absolute; left: 50%; top: 50%; z-index: 12; pointer-events: none;
    width: calc(var(--cw) * .9); height: calc(var(--ch) * .92);
    margin: calc(var(--ch) * -.46 - var(--lift)) 0 0 calc(var(--cw) * -.45);
    border-radius: 6%;
    background: var(--aura, transparent); box-shadow: 0 0 6vh 2vh var(--aura, transparent);
    opacity: 0; transition: opacity .45s;
  }
  #aura.on { opacity: .85; }
  #aura.on.wait { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .inner {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transform: rotateX(calc(var(--my) * -11deg)) rotateY(calc(180deg + var(--mx) * 15deg));
    transition: transform .65s cubic-bezier(.3, .8, .3, 1);
  }
  .card.up .inner { transform: rotateX(calc(var(--my) * -11deg)) rotateY(calc(var(--mx) * 15deg)); }
  .card.live .inner { transition: transform .09s linear; }
  .card.pop { animation: pop .65s cubic-bezier(.3, .8, .3, 1); }
  @keyframes pop { 45% { scale: 1.09; } }

  .face {
    position: absolute; inset: 0; overflow: hidden;
    border-radius: 4.6% / 3.3%;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 1.6vh 3.2vh rgba(0, 0, 0, .55);
  }
  .back { transform: rotateY(180deg); background: #1d2c6b url(cardback.png) center / 100% 100%; }
  .front { background: #1a1c22; isolation: isolate; }
  .front img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .foil, .glit, .glare { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s .25s; }

  /* shared pointer-driven positions */
  .card, .mini { --px: calc(50% + var(--mx) * 50%); --py: calc(50% + var(--my) * 50%); }

  .glare {
    background: radial-gradient(farthest-corner circle at var(--px) var(--py), rgba(255,255,255,.85) 0%, rgba(255,255,255,.3) 22%, rgba(0,0,0,.45) 92%);
    mix-blend-mode: overlay;
  }
  .up .glare { opacity: .3; }

  /* Foil = coloured streaks on black, dodged onto the print: black leaves the card untouched. */
  .foil {
    background-image:
      repeating-linear-gradient(calc(var(--ang, 112deg) + var(--mx) * 12deg),
        #000 0%, #ff3d8b 5%, #ffc94a 9%, #000 14%, #000 22%, #3dffa0 27%, #3db8ff 31%, #000 36%, #000 44%, #a070ff 49%, #ff3d8b 53%, #000 58%);
    background-size: 300% 300%;
    background-position: calc(50% + var(--mx) * 80%) calc(50% + var(--my) * 80%);
    mix-blend-mode: color-dodge;
    filter: brightness(.75) saturate(1.2);
  }
  /* holo rare: denser foil, only inside the art window */
  .t3 .foil {
    clip-path: inset(var(--at) var(--ax) var(--ab) var(--ax) round 1%);
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,.55) 0 1.1%, rgba(0,0,0,0) 1.1% 2.2%),
      repeating-linear-gradient(calc(112deg + var(--mx) * 12deg),
        #ff3d8b 0%, #ffc94a 9%, #3dffa0 18%, #3db8ff 27%, #a070ff 36%, #ff3d8b 45%);
    background-size: 100% 100%, 260% 260%;
    background-position: 0 0, calc(50% + var(--mx) * 80%) calc(50% + var(--my) * 80%);
    filter: brightness(.5) contrast(1.5);
  }
  .t3.up .foil { opacity: .7; }
  /* V / ex: wide diagonal streaks over the whole card */
  .t4 .foil { --ang: 128deg; background-size: 380% 380%; }
  .t4.up .foil { opacity: .55; }
  .t5 .foil { --ang: 128deg; }
  .t5.up .foil { opacity: .65; }
  /* secret tier: gold streaks */
  .t6 .foil {
    --ang: 135deg;
    background-image:
      repeating-linear-gradient(calc(var(--ang) + var(--mx) * 14deg),
        #000 0%, #ffb52e 5%, #fff0b0 8%, #ff8fd0 11%, #000 16%, #000 24%, #ffd24a 29%, #9be7ff 32%, #ffd24a 35%, #000 40%);
  }
  .t6.up .foil { opacity: .7; }

  /* glitter: a field of sparks lit by a highlight that follows the pointer */
  .glit {
    background:
      radial-gradient(circle at var(--px) var(--py), #fff 0%, rgba(255,255,255,.85) 18%, rgba(255,255,255,.12) 55%, rgba(255,255,255,0) 80%);
    -webkit-mask: var(--sparks) calc(var(--mx) * 6%) calc(var(--my) * 6%) / 46% auto;
            mask: var(--sparks) calc(var(--mx) * 6%) calc(var(--my) * 6%) / 46% auto;
    mix-blend-mode: plus-lighter;
  }
  .t5.up .glit { opacity: .75; }
  .t6.up .glit { opacity: 1; }

  /* ================= label ================= */
  #label {
    position: absolute; left: 0; right: 0; z-index: 30;
    top: calc(50% + var(--ch) / 2 - var(--lift) + 2.6vh);
    text-align: center; pointer-events: none; opacity: 0; transform: translateY(.8vh);
    transition: opacity .3s, transform .3s;
  }
  #label.show { opacity: 1; transform: none; }
  #label .n { font-size: clamp(15px, 2.8vh, 22px); font-weight: 600; letter-spacing: -.015em; }
  #label .r { font-size: clamp(11px, 1.9vh, 14px); margin-top: .5vh; color: var(--tc, var(--dim)); font-weight: 500; }

  /* ================= result ================= */
  #result {
    position: fixed; inset: 0; z-index: 35;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 4vh; padding: 4vh 4vw; cursor: default;
  }
  #stage[data-s="done"] #result { display: flex; }
  #stage[data-s="done"] #hint, #stage[data-s="done"] #cards { display: none; }
  #row { display: flex; flex-wrap: wrap; justify-content: center; gap: min(1.8vw, 1.8vh); max-width: 100%; perspective: 1200px; }
  .mini {
    position: relative; width: min(17.2vw, 38vh * 63 / 88); aspect-ratio: 63 / 88;
    --mx: .25; --my: -.2; --aura: transparent;
    animation: rise .55s both cubic-bezier(.2, .8, .2, 1);
  }
  @media (max-aspect-ratio: 1/1) { .mini { width: min(28vw, 29vh * 63 / 88); } }
  @keyframes rise { from { opacity: 0; transform: translateY(4vh) scale(.94); } }
  .mini .face { box-shadow: 0 1vh 2.2vh rgba(0, 0, 0, .55), 0 0 2.6vh -0.4vh var(--aura); }
  #best { text-align: center; font-size: clamp(13px, 2.2vh, 16px); color: var(--dim); }
  #best b { color: var(--ink); font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  button, .btn {
    font: inherit; font-size: clamp(13px, 2.1vh, 15px); font-weight: 600;
    padding: .78em 1.4em; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: rgba(255, 255, 255, .03); color: var(--ink);
    text-decoration: none; transition: background .15s;
  }
  button:hover, .btn:hover { background: rgba(255, 255, 255, .09); }
  button.primary { background: var(--ink); color: #0b0c0f; border-color: var(--ink); }
  button.primary:hover { background: #fff; }
</style>
</head>
<body>

<div id="stage" data-s="shelf">
  <div id="title"></div>
  <div id="shelf"></div>
  <div id="glow"></div>
  <div id="aura"></div>
  <div id="cards"></div>
  <div id="label"><div class="n"></div><div class="r"></div></div>
  <div id="hint"></div>
  <div id="result">
    <div id="row"></div>
    <div id="best"></div>
    <div class="actions">
      <button class="primary" id="again">Rip another</button>
      <button id="change">Change pack</button>
      <a class="btn" id="share" target="_blank" rel="noopener">Post pull</a>
    </div>
  </div>
  <canvas id="fx"></canvas>
</div>

<script src="cards.js"></script>
<script>
// ---------------------------------------------------------------- sets
// hero: card whose art is printed on the pack. art: holo window as [top, side, bottom] insets in % of the card.
const SETS = [
  { id: 'sv3pt5', dex: 'sv/sv03.5', pad: 3, name: 'Scarlet & Violet 151', year: 2023, holoRare: true,
    hero: '199', heroSize: '158%', heroPos: '48% 24%', c: ['#f0562b', '#a81f2c', '#3a0d1c'], art: [11, 7.5, 53] },
  { id: 'sv8pt5', dex: 'sv/sv08.5', pad: 3, name: 'Prismatic Evolutions', year: 2025, holoRare: true,
    hero: '161', heroSize: '185%', heroPos: '50% 31%', c: ['#3d4fb8', '#2a2468', '#0d0c26'], art: [11, 7.5, 53] },
  { id: 'swsh7', dex: 'swsh/swsh7', pad: 0, name: 'Evolving Skies', year: 2021, holoRare: false,
    hero: '218', heroSize: '190%', heroPos: '50% 27%', c: ['#2fa98a', '#14606a', '#082a36'], art: [12, 8, 52] },
  { id: 'base1', dex: 'base/base1', pad: 0, name: 'Base Set', year: 1999, holoRare: false,
    hero: '4', heroSize: '250%', heroPos: '50% 21%', c: ['#f2a23a', '#c4461f', '#4a1410'], art: [12.5, 10.5, 49.5] },
];

// Rarity name -> effect tier. 0 common, 1 uncommon, 2 rare, 3 holo rare, 4 V/ex, 5 ultra, 6 secret.
const TIER = {
  'Common': 0, 'Uncommon': 1, 'Rare': 2, 'Rare Holo': 3,
  'Double Rare': 4, 'Rare Holo V': 4, 'ACE SPEC Rare': 4,
  'Rare Holo VMAX': 5, 'Ultra Rare': 5, 'Rare Ultra': 5, 'Illustration Rare': 5,
  'Special Illustration Rare': 6, 'Rare Rainbow': 6, 'Rare Secret': 6, 'Hyper Rare': 6,
};
const AURA = ['transparent', 'transparent', 'transparent', '#5fc4ff', '#a98bff', '#ff6fc8', '#ffd24a'];
const HIT_W = { 2: 30, 3: 36, 4: 20, 5: 10, 6: 4 };   // weights of the last slot, per tier

for (const s of SETS) {
  s.cards = CARD_DATA[s.id].split(';').map(row => {
    const [n, name, r] = row.split('|');
    const rarity = RARITIES[+r];
    let t = TIER[rarity];
    if (t === 2 && s.holoRare) t = 3;          // every Rare is holo in Scarlet & Violet sets
    return { n, name, rarity, t, set: s };
  });
  s.by = [0, 1, 2, 3, 4, 5, 6].map(t => s.cards.filter(c => c.t === t));
}
const imgUrl = c => `https://assets.tcgdex.net/en/${c.set.dex}/${c.set.pad ? c.n.padStart(c.set.pad, '0') : c.n}/high.webp`;
const imgAlt = c => `https://images.pokemontcg.io/${c.set.id}/${c.n}_hires.png`;
const logoUrl = s => `https://images.pokemontcg.io/${s.id}/logo.png`;

const pick = a => a[Math.floor(Math.random() * a.length)];
const FORCE = +new URLSearchParams(location.search).get('hit');   // ?hit=6 forces the last slot tier, for testing
function rollHit(s) {
  const tiers = Object.keys(HIT_W).map(Number).filter(t => s.by[t].length);
  if (FORCE && tiers.includes(FORCE)) return FORCE;
  let x = Math.random() * tiers.reduce((sum, t) => sum + HIT_W[t], 0);
  for (const t of tiers) { if ((x -= HIT_W[t]) < 0) return t; }
  return tiers[0];
}
function rollPack(s) {
  const out = [];
  for (const t of [0, 0, 1, 1, rollHit(s)]) {
    let c; do { c = pick(s.by[t]); } while (out.includes(c));
    out.push(c);
  }
  return out;
}

// ---------------------------------------------------------------- dom
const $ = id => document.getElementById(id);
const stage = $('stage'), shelf = $('shelf'), cardsEl = $('cards'), label = $('label'), hint = $('hint'), title = $('title');
const setS = s => { stage.dataset.s = s; };
const S = () => stage.dataset.s;

// Sparks texture for the glitter layer: dots and four-point stars on a transparent tile.
(function sparks() {
  const c = document.createElement('canvas'); c.width = c.height = 320;
  const g = c.getContext('2d');
  for (let i = 0; i < 520; i++) {
    g.fillStyle = `rgba(255,255,255,${(.25 + Math.random() * .75).toFixed(2)})`;
    g.beginPath(); g.arc(Math.random() * 320, Math.random() * 320, .4 + Math.random() * 1.3, 0, 7); g.fill();
  }
  g.fillStyle = '#fff';
  for (let i = 0; i < 26; i++) {
    const x = Math.random() * 320, y = Math.random() * 320, r = 3 + Math.random() * 5;
    g.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4, rr = k % 2 ? r * .22 : r;
      g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    g.fill();
  }
  document.documentElement.style.setProperty('--sparks', `url(${c.toDataURL()})`);
})();

function cardFaces(c) {
  return `<div class="face front" style="--at:${c.set.art[0]}%;--ax:${c.set.art[1]}%;--ab:${c.set.art[2]}%">` +
    `<img src="${imgUrl(c)}" data-alt="${imgAlt(c)}" alt="" draggable="false">` +
    (c.t >= 3 ? '<div class="foil"></div>' : '') + (c.t >= 5 ? '<div class="glit"></div>' : '') +
    '<div class="glare"></div></div>';
}
document.addEventListener('error', e => {           // fall back to the second image host
  const el = e.target;
  if (el.tagName === 'IMG' && el.dataset.alt) { el.src = el.dataset.alt; delete el.dataset.alt; }
}, true);

// ---------------------------------------------------------------- particles
const fx = $('fx'), fg = fx.getContext('2d');
let parts = [], fxOn = false;
function fit() { const d = Math.min(devicePixelRatio || 1, 2); fx.width = innerWidth * d; fx.height = innerHeight * d; fg.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', fit); fit();
function burst(x, y, color, n, power, spread = Math.PI * 2, dir = 0) {
  for (let i = 0; i < n; i++) {
    const a = dir + (Math.random() - .5) * spread, v = power * (.3 + Math.random() * .7);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: .012 + Math.random() * .022, r: 1 + Math.random() * 2.4, color: Math.random() < .3 ? '#ffffff' : color });
  }
  if (!fxOn) { fxOn = true; requestAnimationFrame(tick); }
}
function tick() {
  fg.clearRect(0, 0, innerWidth, innerHeight);
  fg.globalCompositeOperation = 'lighter';
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += .12; p.vx *= .985; p.vy *= .985; p.life -= p.decay;
    fg.globalAlpha = Math.max(p.life, 0);
    fg.fillStyle = p.color;
    fg.beginPath(); fg.arc(p.x, p.y, p.r * (.4 + p.life * .6), 0, 7); fg.fill();
  }
  fg.globalAlpha = 1;
  if (parts.length) requestAnimationFrame(tick); else { fxOn = false; fg.clearRect(0, 0, innerWidth, innerHeight); }
}

// ---------------------------------------------------------------- shelf
let sel = 0, set = SETS[0], packEl = null, pack = [], els = [], cur = -1, busy = false;

SETS.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'pack';
  el.style.cssText = `--c1:${s.c[0]};--c2:${s.c[1]};--c3:${s.c[2]}`;
  const hero = s.cards.find(c => c.n === s.hero);
  el.innerHTML =
    `<div class="strip wrap crimp"></div>` +
    `<div class="pbody wrap"><div class="art" style="background-image:url(${imgUrl(hero)});background-size:${s.heroSize} auto;background-position:${s.heroPos}"></div>` +
    `<img class="logo" src="${logoUrl(s)}" alt="${s.name}" draggable="false"><div class="count">5 cards</div>` +
    `<div class="shade"></div><div class="foot crimp"></div><div class="mouth"></div></div><div class="sheen"></div><div class="cut"></div>`;
  shelf.appendChild(el);
  s.el = el;
});

function layout() {
  SETS.forEach((s, i) => {
    const o = i - sel;
    s.el.style.setProperty('--o', o);
    s.el.style.setProperty('--a', Math.abs(o));
    s.el.style.zIndex = 20 - Math.abs(o);
    s.el.classList.toggle('far', Math.abs(o) > 1);
  });
  title.innerHTML = `${SETS[sel].name}<small>${SETS[sel].year}</small>`;
  hint.innerHTML = '<b>Tap</b> the pack to pick it · swipe for more';
}
function toShelf() {
  SETS.forEach(s => { s.el.className = 'pack'; s.el.style.removeProperty('--cut'); });
  cardsEl.innerHTML = ''; label.classList.remove('show'); setAura(null);
  packEl = null; busy = false;
  setS('shelf'); layout();
}
function choose() {
  set = SETS[sel]; packEl = set.el;
  SETS.forEach(s => { s.el.className = 'pack'; s.el.style.removeProperty('--cut'); });
  packEl.classList.add('chosen');
  packEl.style.setProperty('--o', 0); packEl.style.setProperty('--a', 0);
  deal();
  setS('sealed');
  hint.innerHTML = '<b>Swipe</b> across the top to rip';
}

// ---------------------------------------------------------------- rip
function deal() {
  pack = rollPack(set);
  pack.forEach(c => { new Image().src = imgUrl(c); });
  cardsEl.innerHTML = '';
  els = pack.map((c, i) => {
    const el = document.createElement('div');
    el.className = `card t${c.t}` + (c.t >= 4 ? ' hot' : '');
    el.style.setProperty('--d', i);
    el.style.setProperty('--aura', AURA[c.t]);
    el.style.zIndex = 10 - i;
    el.innerHTML = `<div class="inner"><div class="face back"></div>${cardFaces(c)}</div>`;
    cardsEl.appendChild(el);
    return el;
  });
  cur = -1;
  label.classList.remove('show');
}

function cutPoint(p) {
  const r = packEl.getBoundingClientRect();
  return [r.left + r.width * p, r.top + r.height * .085];
}
function setCut(p) {
  packEl.classList.add('cutting');
  packEl.style.setProperty('--cut', p);
  const [x, y] = cutPoint(p);
  burst(x, y, '#ffe9b0', 3, 3.2, Math.PI, -Math.PI / 2);
}
function autoCut(from = 0) {
  busy = true;
  const t0 = performance.now(), dur = 380 * (1 - from);
  (function step(t) {
    const p = Math.min(from + (1 - from) * (t - t0) / Math.max(dur, 1), 1);
    setCut(p);
    if (p < 1) requestAnimationFrame(step); else tear();
  })(t0);
}
function tear() {
  busy = true;
  setS('torn');
  packEl.classList.add('torn');
  packEl.style.setProperty('--rx', '0deg'); packEl.style.setProperty('--ry', '0deg');
  const [x, y] = cutPoint(.5);
  burst(x, y, '#ffe9b0', 46, 7, Math.PI, -Math.PI / 2);
  hint.innerHTML = '';
  setTimeout(() => { setS('out'); packEl.classList.add('off'); }, 420);
  setTimeout(() => {
    setS('cards');
    els[0].classList.add('top');
    hint.innerHTML = '<b>Tap</b> to flip';
    busy = false;
  }, 1250);
}

// ---------------------------------------------------------------- reveal
const aura = $('aura');
function setAura(c, waiting) {
  const on = !!c && c.t >= 3;
  if (on) aura.style.setProperty('--aura', AURA[c.t]);
  aura.classList.toggle('on', on);
  aura.classList.toggle('wait', on && !!waiting);
}
let rockId = 0;
function rock(el) {                       // one slow tilt so the foil shows without a pointer
  const id = ++rockId, t0 = performance.now();
  (function step(t) {
    if (id !== rockId) return;
    const k = (t - t0) / 1500;
    if (k >= 1) { el.style.setProperty('--mx', 0); el.style.setProperty('--my', 0); el.classList.remove('live'); return; }
    const amp = Math.sin(k * Math.PI);
    el.classList.add('live');
    el.style.setProperty('--mx', (Math.sin(k * Math.PI * 2) * .75 * amp).toFixed(3));
    el.style.setProperty('--my', (Math.cos(k * Math.PI * 2) * -.35 * amp).toFixed(3));
    requestAnimationFrame(step);
  })(t0);
}
function flip(i) {
  cur = i;
  const c = pack[i], el = els[i];
  el.classList.add('top', 'up');
  setAura(c, false);
  if (c.t >= 4) {
    el.classList.add('pop');
    const r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, AURA[c.t], c.t >= 6 ? 150 : c.t === 5 ? 90 : 50, c.t >= 6 ? 13 : 9);
  }
  setTimeout(() => {
    label.querySelector('.n').textContent = c.name;
    const r = label.querySelector('.r');
    r.textContent = c.rarity;
    r.style.setProperty('--tc', c.t >= 3 ? AURA[c.t] : '');
    label.classList.add('show');
    if (c.t >= 3) rock(el);
  }, 300);
  hint.innerHTML = i < pack.length - 1 ? `${i + 1} of ${pack.length} · <b>tap</b> for the next` : '<b>Tap</b> to finish';
}
function next() {
  if (busy) return;
  if (cur < 0) { flip(0); return; }
  const el = els[cur];
  if (!el.classList.contains('up')) { flip(cur); return; }      // the hit waits for its own tap
  busy = true; rockId++;
  label.classList.remove('show');
  el.classList.remove('live', 'top');
  el.classList.add('gone');
  setAura(null);
  if (cur === pack.length - 1) { setTimeout(() => { finish(); busy = false; }, 420); return; }
  const n = cur + 1;
  els[n].classList.add('top');
  if (n === pack.length - 1) {
    cur = n;
    setAura(pack[n], true);
    setTimeout(() => { hint.innerHTML = '<b>Tap</b> to reveal the last card'; busy = false; }, 350);
  } else {
    setTimeout(() => { flip(n); busy = false; }, 170);
  }
}
function finish() {
  setS('done');
  $('row').innerHTML = pack.map((c, i) =>
    `<div class="mini up t${c.t}" style="animation-delay:${i * 80}ms;--aura:${AURA[c.t]}">${cardFaces(c)}</div>`).join('');
  const best = pack.reduce((a, b) => (b.t > a.t ? b : a));
  $('best').innerHTML = `Best pull: <b>${best.name}</b> · ${best.rarity}`;
  const text = `Pulled ${best.name} (${best.rarity}) from a free ${set.name} rip`;
  $('share').href = 'https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(location.href.split(/[?#]/)[0]);
  if (best.t >= 5) setTimeout(() => burst(innerWidth / 2, innerHeight * .4, AURA[best.t], 80, 11), 400);
}

// ---------------------------------------------------------------- input
let down = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('#result')) return;
  down = { x: e.clientX, y: e.clientY, moved: false, onPack: !!(packEl && e.target.closest('.pack')), target: e.target.closest('.pack') };
});
addEventListener('pointermove', e => {
  const s = S();
  if (down && (Math.abs(e.clientX - down.x) > 8 || Math.abs(e.clientY - down.y) > 8)) down.moved = true;

  if (s === 'shelf' || s === 'sealed') {                        // packs lean towards the pointer
    const el = s === 'shelf' ? SETS[sel].el : packEl;
    const r = el.getBoundingClientRect();
    const mx = Math.max(-1, Math.min(1, (e.clientX - r.left - r.width / 2) / r.width));
    const my = Math.max(-1, Math.min(1, (e.clientY - r.top - r.height / 2) / r.height));
    el.classList.add('tilt');
    el.style.setProperty('--ry', (mx * 16).toFixed(2) + 'deg');
    el.style.setProperty('--rx', (-my * 12).toFixed(2) + 'deg');
    el.style.setProperty('--sx', (50 + mx * 60).toFixed(1) + '%');
    el.style.setProperty('--sy', (40 + my * 60).toFixed(1) + '%');
  }
  if (s === 'sealed' && down && down.moved && !busy) {         // drag = tear progress
    const r = packEl.getBoundingClientRect();
    const dx = Math.abs(e.clientX - down.x) / r.width;
    if (Math.abs(e.clientX - down.x) > Math.abs(e.clientY - down.y)) {
      const p = Math.min(dx * 1.15, 1);
      setCut(p);
      if (p >= 1) { down = null; tear(); }
    }
  }
  if (s === 'cards' && cur >= 0 && !busy && els[cur].classList.contains('up')) {
    rockId++;
    const el = els[cur], r = el.getBoundingClientRect();
    el.classList.add('live');
    el.style.setProperty('--mx', Math.max(-1, Math.min(1, (e.clientX - r.left - r.width / 2) / (r.width * .75))).toFixed(3));
    el.style.setProperty('--my', Math.max(-1, Math.min(1, (e.clientY - r.top - r.height / 2) / (r.height * .75))).toFixed(3));
  }
  if (s === 'done') {
    const mx = (e.clientX / innerWidth - .5) * 2, my = (e.clientY / innerHeight - .5) * 2;
    for (const m of $('row').children) { m.style.setProperty('--mx', mx.toFixed(3)); m.style.setProperty('--my', my.toFixed(3)); }
  }
});
addEventListener('pointerup', e => {
  const d = down; down = null;
  if (!d) return;
  const s = S(), dx = e.clientX - d.x;
  if (s === 'shelf') {
    if (d.moved) {
      if (Math.abs(dx) > 30) { sel = Math.max(0, Math.min(SETS.length - 1, sel + (dx < 0 ? 1 : -1))); resetTilt(); layout(); }
      return;
    }
    const i = SETS.findIndex(x => x.el === d.target);
    if (i < 0) return;
    if (i === sel) choose(); else { sel = i; resetTilt(); layout(); }
    return;
  }
  if (s === 'sealed' && !busy) {
    const p = parseFloat(packEl.style.getPropertyValue('--cut')) || 0;
    if (d.moved && p < .35) { packEl.classList.remove('cutting'); packEl.style.setProperty('--cut', 0); return; }
    autoCut(d.moved ? p : 0);
    return;
  }
  if (s === 'cards' && !d.moved) next();
});
addEventListener('pointerleave', resetTilt);
function resetTilt() {
  for (const s of SETS) { s.el.classList.remove('tilt'); s.el.style.setProperty('--rx', '0deg'); s.el.style.setProperty('--ry', '0deg'); }
}
addEventListener('keydown', e => {
  const s = S();
  if (s === 'shelf' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) {
    sel = Math.max(0, Math.min(SETS.length - 1, sel + (e.code === 'ArrowRight' ? 1 : -1))); layout(); return;
  }
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  e.preventDefault();
  if (s === 'shelf') choose();
  else if (s === 'sealed' && !busy) autoCut(0);
  else if (s === 'cards') next();
  else if (s === 'done') choose();
});
$('again').addEventListener('click', choose);
$('change').addEventListener('click', toShelf);

layout();
</script>
</body>
</html>
