<style>
  :root { --ink: #f4f5f7; --dim: rgba(244, 245, 247, .56); --faint: rgba(244, 245, 247, .16); --acc: #ffffff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: #07080b; color: var(--ink); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .ui { position: fixed; left: 0; right: 0; pointer-events: none; text-align: center; opacity: 0; transition: opacity .45s ease, transform .55s cubic-bezier(.2, .8, .2, 1); }
  .ui.top { top: 0; padding-top: max(4.2vh, env(safe-area-inset-top)); transform: translateY(-1.2vh); }
  .ui.bottom { bottom: 0; padding-bottom: max(4vh, env(safe-area-inset-bottom)); transform: translateY(1.2vh); }
  body[data-s="shelf"] .s-shelf, body[data-s="sealed"] .s-sealed, body[data-s="cards"] .s-cards, body[data-s="result"] .s-result { opacity: 1; transform: none; }
  body[data-s="shelf"] .s-shelf *, body[data-s="result"] .s-result * { pointer-events: auto; }

  .eyebrow { font-size: clamp(10px, 1.55vh, 12px); font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  .h1 { margin-top: .9vh; font-size: clamp(20px, 4.1vh, 34px); font-weight: 700; letter-spacing: -.028em; line-height: 1.05; }
  .sub { margin-top: .8vh; font-size: clamp(11px, 1.85vh, 14px); color: var(--dim); font-variant-numeric: tabular-nums; }

  .dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 2.2vh; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--faint); transition: width .35s cubic-bezier(.2, .8, .2, 1), background .35s; }
  .dots i.on { width: 20px; background: var(--ink); }

  button, .btn {
    font: inherit; font-size: clamp(13px, 2.15vh, 16px); font-weight: 600; letter-spacing: -.005em;
    height: clamp(40px, 6.6vh, 50px); padding: 0 1.7em; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--faint); background: rgba(255, 255, 255, .06); color: var(--ink);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    text-decoration: none; transition: transform .18s cubic-bezier(.2, .8, .2, 1), background .18s;
  }
  button:hover, .btn:hover { background: rgba(255, 255, 255, .12); }
  button:active, .btn:active { transform: scale(.96); }
  button.primary { background: var(--ink); color: #0a0b0e; border-color: transparent; }
  button.primary:hover { background: #fff; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 0 16px; }

  .nav { position: fixed; top: 50%; width: 44px; height: 44px; margin-top: -22px; padding: 0; border-radius: 50%; opacity: 0; pointer-events: none; transition: opacity .4s, transform .18s, background .18s; }
  .nav svg { width: 18px; height: 18px; }
  #prev { left: max(2.5vw, 10px); } #next { right: max(2.5vw, 10px); }
  body[data-s="shelf"] .nav { opacity: 1; pointer-events: auto; }
  body[data-s="shelf"] .nav[disabled] { opacity: .25; pointer-events: none; }
  @media (max-width: 440px) { .nav { display: none; } }

  .hint { font-size: clamp(12px, 2vh, 15px); color: var(--dim); }
  .hint b { color: var(--ink); font-weight: 600; }

  .pips { display: flex; justify-content: center; gap: 6px; }
  .pips i { width: 22px; height: 3px; border-radius: 2px; background: var(--faint); transition: background .4s; }
  .pips i.on { background: var(--ink); }

  #label { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .45s cubic-bezier(.2, .8, .2, 1); }
  #label.show { opacity: 1; transform: none; }
  #label .n { font-size: clamp(16px, 3vh, 24px); font-weight: 700; letter-spacing: -.022em; }
  #label .r { margin-top: .5vh; font-size: clamp(10px, 1.6vh, 12px); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--rc, var(--dim)); }

  /* compact: a short frame such as the 16:9 player inside an X post. The scene fills the height, text is few and large. */
  #setName2 { display: none; }
  body.compact .ui.top { padding-top: 10px; } body.compact .ui.bottom { padding-bottom: 10px; }
  body.compact .s-shelf.top, body.compact .dots, body.compact .s-cards.top, body.compact .s-result .eyebrow { display: none; }
  body.compact #setName2 { display: block; margin-bottom: 7px; font-size: 16px; font-weight: 700; letter-spacing: -.02em; text-shadow: 0 1px 10px rgba(0, 0, 0, .8); }
  body.compact button, body.compact .btn { height: 36px; font-size: 14px; padding: 0 1.5em; }
  body.compact .nav { width: 40px; height: 40px; margin-top: -20px; padding: 0; }
  body.compact .hint { font-size: 14px; text-shadow: 0 1px 8px rgba(0, 0, 0, .9); }
  body.compact #label .n { font-size: 16px; } body.compact #label .r { font-size: 10px; margin-top: 2px; }
  body.compact .s-result .h1 { font-size: 18px; margin-top: 0; } body.compact .s-result .sub { font-size: 12px; margin-top: 2px; }
  body.compact .s-result .row { gap: 8px; } body.compact .s-result button, body.compact .s-result .btn { height: 34px; font-size: 13px; padding: 0 1.3em; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); transition: opacity .5s; pointer-events: none; }
  body:not([data-s="boot"]) #boot { opacity: 0; }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body data-s="boot">

<canvas id="gl"></canvas>
<div id="boot">Loading</div>

<!-- shelf -->
<div class="ui top s-shelf">
  <div class="eyebrow" id="setYear"></div>
  <div class="h1" id="setName"></div>
  <div class="sub" id="setSub"></div>
</div>
<button class="nav" id="prev" aria-label="Previous pack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="nav" id="next" aria-label="Next pack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
<div class="ui bottom s-shelf">
  <div id="setName2"></div>
  <div class="dots" id="dots"></div>
  <button class="primary" id="open">Open pack</button>
</div>

<!-- sealed -->
<div class="ui bottom s-sealed"><div class="hint"><b>Swipe</b> across the top to tear it open</div></div>

<!-- cards -->
<div class="ui top s-cards"><div class="pips" id="pips"></div></div>
<div id="label"><div class="n"></div><div class="r"></div></div>

<!-- result -->
<div class="ui top s-result">
  <div class="eyebrow">Best pull</div>
  <div class="h1" id="bestName"></div>
  <div class="sub" id="bestRar"></div>
</div>
<div class="ui bottom s-result">
  <div class="row">
    <button class="primary" id="again">Rip another</button>
    <button id="change">Change pack</button>
    <a class="btn" id="share" target="_blank" rel="noopener">Post pull</a>
  </div>
</div>

<script src="cards.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
